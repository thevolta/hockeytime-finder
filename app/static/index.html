<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <title>HockeyTime Finder</title>

  <!-- FullCalendar v7: skeleton + theme are both required -->
<link rel="stylesheet" href="/static/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div>
      <div class="eyebrow">Arizona beta</div>
      <h1>HockeyTime Finder</h1>
      <p>Find Stick Time, Open Hockey and Flow Hockey in one place.</p>
    </div>
    <div class="header-actions">
      <a class="button discord-button"
         href="https://discord.gg/fCe6p2udW7"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Join our Discord">
        <svg class="discord-icon" viewBox="0 0 127.14 96.36" aria-hidden="true">
          <path fill="currentColor" d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.18 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77.35 77.35 0 0 0 6.89 11.17 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 59.93 31 52.86S36.07 40 42.45 40s11.55 5.81 11.44 12.86c0 7.07-5.06 12.83-11.44 12.83Zm42.24 0c-6.27 0-11.44-5.76-11.44-12.83S78.31 40 84.69 40s11.55 5.81 11.44 12.86c0 7.07-5.06 12.83-11.44 12.83Z"/>
        </svg>
        <span>Join our Discord</span>
      </a>
      <a class="button secondary" href="/calendar.ics">Subscribe / ICS</a>
      <button class="button" id="refreshButton" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="Event filters">
      <div class="filter-group">
        <span class="filter-label">Event type</span>
        <label><input type="checkbox" value="Stick Time" class="type-filter" checked> Stick Time</label>
        <label><input type="checkbox" value="Open Hockey" class="type-filter" checked> Open Hockey</label>
        <label><input type="checkbox" value="Flow Hockey" class="type-filter" checked> Flow Hockey</label>
        <label><input type="checkbox" value="Adult Skills" class="type-filter" checked> Adult Skills</label>
        <span class="filter-divider" aria-hidden="true"></span>

        <div class="time-filters" aria-label="Time of day filters">
          <label class="time-filter">
            <input type="checkbox" id="filterAM" checked>
            AM
          </label>

          <label class="time-filter">
            <input type="checkbox" id="filterPM" checked>
            PM
          </label>

          <label class="work-hours-filter">
            <input type="checkbox" id="noWorkHours">
            No work hours
          </label>
        </div>
      </div>

      <div class="filter-group">
        <label for="rinkFilter" class="filter-label">Rink</label>
        <select id="rinkFilter">
          <option value="">All rinks</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="viewSelect" class="filter-label">View</label>
        <select id="viewSelect">
          <option value="timeGridWeek" selected>Week</option>
          <option value="dayGridMonth">Month</option>
          <option value="listWeek">Upcoming</option>
        </select>
      </div>
    </section>

    <section class="status-row">
      <div>
        <strong id="eventCount">0</strong>
        <span>matching events</span>
      </div>
      <div id="statusText" class="muted" aria-live="polite">Loading schedules…</div>
    </section>

    <section class="calendar-shell">
      <div id="calendar"></div>
    </section>

    <section class="upcoming-section">
      <div class="section-heading upcoming-heading">
        <div>
          <div class="eyebrow">Quick view</div>
          <h2>Next sessions</h2>
        </div>

        <div class="upcoming-pagination">
          <span id="upcomingPageInfo" class="muted"></span>
          <button class="button secondary small-button" id="upcomingPrev" type="button">Previous</button>
          <button class="button secondary small-button" id="upcomingNext" type="button">Next</button>
        </div>
      </div>

      <div id="upcomingList" class="upcoming-list"></div>
    </section>
  </main>

  <dialog id="eventDialog">
    <form method="dialog">
      <button class="dialog-close" aria-label="Close">×</button>
    </form>
    <div class="dialog-content">
      <div id="dialogType" class="event-type"></div>
      <h2 id="dialogTitle"></h2>
      <div class="event-meta" id="dialogMeta"></div>
      <div class="dialog-actions">
        <a id="dialogRegister" class="button" target="_blank" rel="noopener noreferrer">Register / View</a>
        <button id="dialogAddCalendar" class="button secondary" type="button">Add to Calendar</button>
      </div>
    </div>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
